name: Release

# Package only an explicit version tag. Never runs because tauri.conf.json
# changed on main. Rebuild a tag via workflow_dispatch after signing is added.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to rebuild (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Verify tag and CI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify version, main, and CI
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          FILE=apps/desktop/src-tauri/tauri.conf.json
          VERSION=$(jq -r .version "$FILE")
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match $FILE version $VERSION (expected $EXPECTED)"
            exit 1
          fi

          git fetch origin main
          SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Commit $SHA is not on origin/main. Only tag commits that are already on main."
            exit 1
          fi

          echo "Waiting for a successful CI run on $SHA"
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            JSON=$(gh run list --workflow ci.yml --commit "$SHA" --limit 20 --json conclusion,status)
            echo "$JSON"

            if echo "$JSON" | jq -e '.[] | select(.conclusion == "success")' >/dev/null; then
              echo "CI passed on $SHA"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            in_flight=$(echo "$JSON" | jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
            failed=$(echo "$JSON" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')

            if [ "$in_flight" = "0" ] && [ "$failed" != "0" ]; then
              echo "CI did not succeed on $SHA"
              exit 1
            fi

            if [ "$JSON" = "[]" ]; then
              echo "No CI run found yet for $SHA"
            fi
            sleep 30
          done

          echo "Timed out waiting for a successful CI run on $SHA"
          exit 1

  build:
    name: Package ${{ matrix.platform }}
    needs: gate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # Prefer Corepack over pnpm/action-setup: standalone mode crashes while
      # switching versions (integrity undefined), and the npm self-installer
      # breaks on Node 24 runners.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm from packageManager
        working-directory: apps/desktop
        run: corepack install

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        working-directory: apps/desktop
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Unsigned until secrets exist on the `release` environment.
      # When ready, drop the unsigned suffix and set:
      #   Apple: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #          APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #   Windows: see https://v2.tauri.app/distribute/sign/windows/
      #   Tauri updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # Linux stays unsigned (optional later: GPG).
      - name: Build Tauri app (unsigned)
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: taurvia-linux-unsigned-${{ needs.gate.outputs.version }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: taurvia-windows-unsigned-${{ needs.gate.outputs.version }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: taurvia-macos-unsigned-${{ needs.gate.outputs.version }}
          path: |
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: Taurvia ${{ needs.gate.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
